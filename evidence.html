<!DOCTYPE html>

    <style>
        body { background: #0b0b0b; color: #fff; font-family: 'Courier New', Courier, monospace; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        #sidebar { width: 250px; background: #151515; border-right: 2px solid #333; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .folder-label { color: #666; font-size: 0.8rem; text-transform: uppercase; margin-bottom: 5px; }
        .nav-btn { background: transparent; border: 1px solid #444; color: #aaa; padding: 12px; text-align: left; cursor: pointer; transition: 0.3s; font-family: inherit; }
        .nav-btn:hover { background: #222; color: #fff; border-color: #ee4035; }
        .nav-btn.active { background: #ee4035; color: #fff; border-color: #ee4035; box-shadow: 0 0 10px rgba(238,64,53,0.3); }
        #content-area { flex-grow: 1; padding: 40px; overflow-y: auto; background: radial-gradient(circle at top, #1a1a1a 0%, #0b0b0b 100%); }
        .section-header { border-bottom: 2px solid #ee4035; padding-bottom: 10px; margin-bottom: 30px; }
        .section-header h1 { margin: 0; font-size: 1.5rem; letter-spacing: 2px; }
        .evidence-list { display: block; width: 100%; max-width: 900px; margin: auto; }
        .evidence-item { width: 100%; background: #fff; padding: 10px; margin-bottom: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); position: relative; }
        .evidence-item img { width: 100%; height: auto; display: block; border: 1px solid #ddd; }
        
        /* Official Redaction Overlay Style */
        .redacted-overlay::after {
            content: "OFFICIAL SENSITIVE - CASE REF: TESCO-ASH-2024";
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-25deg);
            font-size: 1.8rem; color: rgba(238, 64, 53, 0.15); border: 4px solid rgba(238, 64, 53, 0.15);
            padding: 15px; pointer-events: none; white-space: nowrap; font-weight: bold;
        }

        .hidden { display: none !important; }
        .placeholder { color: #444; text-align: center; margin-top: 100px; font-style: italic; }
    </style>
</head>

<script>
/* 
 * KERNEL DATA MAPPING v4.1
 */
const _0x4f12 = ["emails-section", "medical-section", "bodycam-section", "logs-section", "active", "hidden"];

function _RENDER_VIEW(targetId, btn) {
    // Hide all 4 sections
    _0x4f12.slice(0, 4).forEach(id => {
        document.getElementById(id).classList.add(_0x4f12[5]);
    });
    // Show target
    document.getElementById(targetId).classList.remove(_0x4f12[5]);
    // Reset buttons
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove(_0x4f12[4]));
    btn.classList.add(_0x4f12[4]);
}

// Event Listeners for Nav
document.getElementById('btn-emails').onclick = function() { _RENDER_VIEW(_0x4f12[0], this); };

document.getElementById('btn-bodycam').onclick = function() { _RENDER_VIEW(_0x4f12[2], this); };

/* [SYSTEM_LOG]: Memory sector 0x4f assigned to Medical_Disclosure_Node */
</script>
