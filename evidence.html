<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TERMINAL: Tesco Ashford Case Files</title>
    <style>
        body { background: #0b0b0b; color: #fff; font-family: 'Courier New', Courier, monospace; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* SIDEBAR / FILE EXPLORER */
        #sidebar { width: 250px; background: #151515; border-right: 2px solid #333; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .folder-label { color: #666; font-size: 0.8rem; text-transform: uppercase; margin-bottom: 5px; }
        .nav-btn { background: transparent; border: 1px solid #444; color: #aaa; padding: 12px; text-align: left; cursor: pointer; transition: 0.3s; font-family: inherit; }
        .nav-btn:hover { background: #222; color: #fff; border-color: #ee4035; }
        .nav-btn.active { background: #ee4035; color: #fff; border-color: #ee4035; box-shadow: 0 0 10px rgba(238,64,53,0.3); }

        /* MAIN CONTENT AREA */
        #content-area { flex-grow: 1; padding: 40px; overflow-y: auto; background: radial-gradient(circle at top, #1a1a1a 0%, #0b0b0b 100%); }
        .section-header { border-bottom: 2px solid #ee4035; padding-bottom: 10px; margin-bottom: 30px; }
        .section-header h1 { margin: 0; font-size: 1.5rem; letter-spacing: 2px; }

        /* THE EMAIL VIEWER */
        .evidence-list { display: block; width: 100%; max-width: 900px; margin: auto; }
        .evidence-item { width: 100%; background: #fff; padding: 10px; margin-bottom: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .evidence-item img { width: 100%; height: auto; display: block; border: 1px solid #ddd; }
        
        .hidden { display: none !important; }
        .placeholder { color: #444; text-align: center; margin-top: 100px; font-style: italic; }
    </style>
</head>
<body>

    <!-- SIDEBAR NAVIGATION -->
    <div id="sidebar">
        <div style="margin-bottom: 30px;">
            <div style="color: #ee4035; font-weight: bold; font-size: 1.2rem;">ADMIN_V3.1</div>
            <div style="color: #444; font-size: 0.7rem;">SYSTEM: ENCRYPTED</div>
        </div>

        <div class="folder-label">Directories</div>
        <button class="nav-btn active" onclick="showSection('emails', this)">📁 EMAIL_THREADS</button>
        <button class="nav-btn" onclick="showSection('bodycam', this)">📁 BODYCAM_STILLS</button>
        <button class="nav-btn" onclick="showSection('logs', this)">📁 POLICE_CAD_LOGS</button>
        
        <div class="folder-label" style="margin-top: auto;">Commands</div>
        <button class="nav-btn" onclick="window.location.href='index.html'">↩ LOGOUT</button>
    </div>

    <!-- MAIN CONTENT -->
    <div id="content-area">
        
        <!-- SECTION: EMAILS -->
        <div id="emails-section">
            <div class="section-header"><h1>/ROOT/EMAILS</h1></div>
            <div class="evidence-list">
                <div class="evidence-item"><img src="email1.png"></div>
                <div class="evidence-item"><img src="email2.png"></div>
                <div class="evidence-item"><img src="email3.png"></div>
                <div class="evidence-item"><img src="email4.png"></div>
                <div class="evidence-item"><img src="email5.png"></div>
                <div class="evidence-item"><img src="email6.png"></div>
                <div class="evidence-item"><img src="email7.png"></div>
                <div class="evidence-item"><img src="email8.png"></div>
            </div>
        </div>

        <!-- SECTION: BODYCAM -->
        <div id="bodycam-section" class="hidden">
            <div class="section-header"><h1>/ROOT/BODYCAM</h1></div>
            <p class="placeholder">PENDING SUBJECT ACCESS REQUEST RELEASE...</p>
        </div>

        <!-- SECTION: LOGS -->
        <div id="logs-section" class="hidden">
            <div class="section-header"><h1>/ROOT/CAD_LOGS</h1></div>
            <p class="placeholder">AWAITING KENT POLICE DISCLOSURE...</p>
        </div>
    </div>

    <!-- THIS LINE CALLS ALL YOUR SECURITY AND NAV LOGIC -->
    <script src="security.js"></script>

</body>
</html>
