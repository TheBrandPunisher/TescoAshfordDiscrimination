<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tesco Ashford: Transparency Project</title>
    <style>
        body { background: #0b0b0b; color: #fff; font-family: 'Arial Black', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
        #timer-container { text-align: center; transition: opacity 0.8s ease; }
        #gta-notification {
            position: fixed; top: 20px; left: -400px; background: rgba(0, 0, 0, 0.9); border-left: 6px solid #fff;
            padding: 15px 30px; color: #fff; font-family: 'Arial', sans-serif; font-weight: bold; font-size: 1.3rem;
            text-transform: uppercase; box-shadow: 8px 8px 0px rgba(0,0,0,0.5); transition: left 0.5s cubic-bezier(0.18, 0.89, 0.32, 1.28); z-index: 9999;
        }
        #gta-notification.show { left: 20px; }
        .cheat-text { color: #fdfd11; display: block; font-size: 0.85rem; letter-spacing: 1px; margin-bottom: 4px; }
        #countdown { font-size: 4.5rem; font-weight: bold; font-family: monospace; color: #fff; text-shadow: 0 0 15px rgba(238,64,53,0.6); margin: 20px 0; }
        .status-bar { color: #666; font-family: monospace; margin-top: 20px; font-size: 1rem; }
    </style>
</head>
<body>

    <div id="gta-notification">
        <span id="notif-header" class="cheat-text">Cheat Activated</span>
        <span id="notif-body">Time Travel</span>
    </div>

    <div id="timer-container">
        <h1>Tesco Ashford: Incident Evidence</h1>
        <p style="color: #bbb;">Public Disclosure Event Initiated. Time remaining:</p>
        <div id="countdown"></div>
        <div class="status-bar">[ STATUS: AWAITING EXECUTIVE RESOLUTION ]<br>[ NOTICE: 8-DAY LEGAL DISCLOSURE ACTIVE ]</div>
    </div>

    <script>
        const myIP = "86.149.135.243";
        const targetDate = new Date("May 13, 2026 14:00:00").getTime();

        const timerInterval = setInterval(() => {
            const now = new Date().getTime();
            const distance = targetDate - now;
            if (distance < 0) { clearInterval(timerInterval); revealSite(); return; }

            const d = Math.floor(distance / (1000 * 60 * 60 * 24));
            const h = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((distance % (1000 * 60)) / 1000);
            document.getElementById("countdown").innerHTML = `${d}d ${h}h ${m}m ${s}s`;
        }, 1000);

        function revealSite() {
            document.getElementById("timer-container").style.opacity = "0";
            setTimeout(() => { window.location.href = "evidence.html"; }, 800);
        }

        const cheatCode = ['ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ArrowLeft', 'ArrowRight'];
        let pos = 0;
        document.addEventListener('keydown', (e) => {
            if (e.key === cheatCode[pos]) {
                pos++;
                if (pos === cheatCode.length) { triggerGta(); pos = 0; }
            } else { pos = 0; }
        });

        function triggerGta() {
            const notify = document.getElementById("gta-notification");
            notify.classList.add("show");
            fetch('https://api.ipify.org?format=json').then(res => res.json()).then(data => {
                if (data.ip === myIP) { setTimeout(() => { revealSite(); }, 2000); }
                else { 
                    document.getElementById("notif-header").innerText = "Cheat Failed";
                    document.getElementById("notif-body").innerText = "Unauthorized IP";
                    setTimeout(() => notify.classList.remove("show"), 3000);
                }
            });
        }
    </script>
</body>
</html>
