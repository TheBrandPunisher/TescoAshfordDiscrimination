<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tesco Ashford: Transparency Project</title>
    <style>
        body { background: #0b0b0b; color: #fff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        #timer-container { text-align: center; }
        .hidden { display: none; }
        #live-site { padding: 50px; overflow-y: auto; height: 100vh; width: 100%; }
        h1 { font-size: 3rem; color: #ee4035; } /* Tesco Red for irony */
    </style>
</head>
<body>

    <!-- SECTION A: THE COUNTDOWN -->
    <div id="timer-container">
        <h1>Tesco Ashford: Incident Evidence</h1>
        <p>This site will go live in:</p>
        <div id="countdown" style="font-size: 4rem; font-weight: bold;"></div>
        <p style="color: #666;">Awaiting Executive Resolution | 7-Day Notice Active</p>
    </div>

    <!-- SECTION B: THE ACTUAL CONTENT (Initially Hidden) -->
    <div id="live-site" class="hidden">
        <h1>Admin Access Granted</h1>
        <p>This is where you will build your evidence board, upload the blurred bodycam screenshots, and list your sources.</p>
        <!-- Add your real content here -->
    </div>

    <script>
        const myIP = "86.149.135.243"; // Replace with your actual IP
        const targetDate = new Date();
        targetDate.setDate(targetDate.getDate() + 8);

        // 1. COUNTDOWN LOGIC
        setInterval(() => {
            const now = new Date().getTime();
            const distance = targetDate - now;
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            document.getElementById("countdown").innerHTML = `${days}d ${hours}h`;
            
            if (distance < 0) {
                document.getElementById("timer-container").classList.add("hidden");
                document.getElementById("live-site").classList.remove("hidden");
            }
        }, 1000);

        // 2. SECRET UNLOCK LOGIC
        let keysPressed = {};
        let unlockTimer;

        window.onkeydown = (e) => {
            keysPressed[e.key] = true;
            
            // Check for: Space, Backspace, 6, 9
            if (keysPressed[' '] && keysPressed['Backspace'] && keysPressed['6'] && keysPressed['9']) {
                if (!unlockTimer) {
                    unlockTimer = setTimeout(checkIPAndUnlock, 1500);
                }
            }
        };

        window.onkeyup = (e) => {
            delete keysPressed[e.key];
            clearTimeout(unlockTimer);
            unlockTimer = null;
        };

        function checkIPAndUnlock() {
            fetch('https://api.ipify.org?format=json')
                .then(res => res.json())
                .then(data => {
                    if (data.ip === myIP) {
                        document.getElementById("timer-container").classList.add("hidden");
                        document.getElementById("live-site").classList.remove("hidden");
                        console.log("Admin Access Verified.");
                    }
                });
        }
    </script>
</body>
</html>
